name: CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    name: Build with Java 21

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B compile

      - name: Run unit tests
        run: mvn -B test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-21
          path: target/surefire-reports/

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    # The Testcontainers stress suite is expensive; run it where it gates a merge
    # (pull requests) or protects the default branch — not on every feature-branch
    # push, which would also double-run it alongside the PR event.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    name: Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: mvn -B verify -Pintegration-tests

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: target/failsafe-reports/

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ build, integration-tests ]
    # Package whenever unit tests pass; tolerate the integration job being skipped
    # on feature-branch pushes (see the condition above), but never its failure.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') }}

    name: Package

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: reservation-lock-jar
          path: target/*.jar
